<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Streaming Reduce architecture</title>
  <desc id="desc">Client requests enter Proxy. Proxy reduces streams from multiple Delegators. Each Delegator reduces streams from multiple target QueryNodes. Target QueryNodes retain existing Segment reduction in P0 and expose Query or Search result streams.</desc>
  <defs>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.7"/>
    </pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#ecfdf5"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#a7f3d0" stroke-width="3" opacity="0.7"/>
    </pattern>
    <pattern id="amberHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fffbeb"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fde68a" stroke-width="3" opacity="0.7"/>
    </pattern>
    <pattern id="grayHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.65"/>
    </pattern>
    <filter id="roughen" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .title { font-size: 34px; }
      .component-title { font-size: 24px; }
      .box-title { font-size: 17px; font-weight: 750; }
      .body { font-size: 14px; font-weight: 600; }
      .small { fill: #667085; font-size: 12px; font-weight: 650; }
      .tiny { fill: #667085; font-size: 11px; font-weight: 700; }
      .outline { stroke-width: 2.2; }
      .inner { fill: #ffffff; stroke-width: 1.6; }
      .data-line { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; }
      .request-line { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-dasharray: 8 7; stroke-linecap: round; }
      .response-line { fill: none; stroke: #475569; stroke-width: 2.8; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" class="hand title">Streaming Reduce Architecture</text>

  <g aria-label="Line legend">
    <path class="request-line" d="M1095 47 L1145 47" marker-end="url(#arrowBlue)"/>
    <text x="1158" y="52" class="tiny">request</text>
    <path class="data-line" d="M1240 47 L1290 47" marker-end="url(#arrowGreen)"/>
    <text x="1303" y="52" class="tiny">server-stream DATA</text>
  </g>

  <g filter="url(#roughen)">
    <rect x="650" y="82" width="300" height="82" rx="10" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
    <text x="800" y="116" text-anchor="middle" class="hand component-title">Client / SDK</text>
    <text x="800" y="143" text-anchor="middle" class="small">existing unary Query / Search API</text>
  </g>

  <path class="request-line" d="M770 164 L770 211" marker-end="url(#arrowBlue)"/>
  <path class="response-line" d="M830 211 L830 164" marker-end="url(#arrowGray)"/>

  <g filter="url(#roughen)">
    <rect x="330" y="214" width="940" height="190" rx="13" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
    <text x="360" y="250" class="hand component-title">Proxy</text>
    <text x="1238" y="248" text-anchor="end" class="small">global demand + unary response</text>

    <rect x="430" y="278" width="300" height="82" rx="9" class="inner" stroke="#d97706"/>
    <text x="580" y="310" text-anchor="middle" class="box-title">StreamReducer.Reduce()</text>
    <text x="580" y="338" text-anchor="middle" class="small">Delegator streams [1..N]</text>

    <path d="M730 319 L850 319" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="850" y="278" width="300" height="82" rx="9" class="inner" stroke="#059669"/>
    <text x="1000" y="310" text-anchor="middle" class="box-title">Reduced ReduceStream</text>
    <text x="1000" y="338" text-anchor="middle" class="small">Recv() builds the client result</text>
  </g>

  <path class="request-line" d="M515 404 C515 438 455 440 455 472" marker-end="url(#arrowBlue)"/>
  <path class="data-line" d="M500 472 C500 440 560 438 560 404" marker-end="url(#arrowGreen)"/>
  <path class="request-line" d="M1085 404 C1085 438 1145 440 1145 472" marker-end="url(#arrowBlue)"/>
  <path class="data-line" d="M1100 472 C1100 440 1040 438 1040 404" marker-end="url(#arrowGreen)"/>
  <text x="800" y="445" text-anchor="middle" class="tiny">QueryStream / SearchStream server-streaming RPCs</text>

  <g filter="url(#roughen)">
    <rect x="90" y="472" width="650" height="190" rx="13" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <text x="120" y="508" class="hand component-title">Delegator A</text>
    <text x="710" y="506" text-anchor="end" class="small">fan-in owner</text>
    <rect x="155" y="538" width="250" height="80" rx="9" class="inner" stroke="#2563eb"/>
    <text x="280" y="570" text-anchor="middle" class="box-title">QN stream handles</text>
    <text x="280" y="596" text-anchor="middle" class="small">children [1..N]</text>
    <path d="M405 578 L470 578" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowGray)"/>
    <rect x="470" y="538" width="205" height="80" rx="9" class="inner" stroke="#059669"/>
    <text x="572" y="570" text-anchor="middle" class="box-title">StreamReducer</text>
    <text x="572" y="596" text-anchor="middle" class="small">returns ReduceStream</text>

    <rect x="860" y="472" width="650" height="190" rx="13" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <text x="890" y="508" class="hand component-title">Delegator B</text>
    <text x="1480" y="506" text-anchor="end" class="small">fan-in owner</text>
    <rect x="925" y="538" width="250" height="80" rx="9" class="inner" stroke="#2563eb"/>
    <text x="1050" y="570" text-anchor="middle" class="box-title">QN stream handles</text>
    <text x="1050" y="596" text-anchor="middle" class="small">children [1..N]</text>
    <path d="M1175 578 L1240 578" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowGray)"/>
    <rect x="1240" y="538" width="205" height="80" rx="9" class="inner" stroke="#059669"/>
    <text x="1342" y="570" text-anchor="middle" class="box-title">StreamReducer</text>
    <text x="1342" y="596" text-anchor="middle" class="small">returns ReduceStream</text>
  </g>

  <g>
    <path class="request-line" d="M260 662 L260 712" marker-end="url(#arrowBlue)"/>
    <path class="data-line" d="M305 712 L305 662" marker-end="url(#arrowGreen)"/>
    <path class="request-line" d="M570 662 L570 712" marker-end="url(#arrowBlue)"/>
    <path class="data-line" d="M615 712 L615 662" marker-end="url(#arrowGreen)"/>
    <path class="request-line" d="M1030 662 L1030 712" marker-end="url(#arrowBlue)"/>
    <path class="data-line" d="M1075 712 L1075 662" marker-end="url(#arrowGreen)"/>
    <path class="request-line" d="M1340 662 L1340 712" marker-end="url(#arrowBlue)"/>
    <path class="data-line" d="M1385 712 L1385 662" marker-end="url(#arrowGreen)"/>
  </g>

  <text x="800" y="690" text-anchor="middle" class="tiny">QueryStreamSegments / SearchStreamSegments server-streaming RPCs</text>

  <g filter="url(#roughen)">
    <rect x="115" y="714" width="280" height="150" rx="11" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <text x="255" y="747" text-anchor="middle" class="hand component-title">Target QN A1</text>
    <rect x="145" y="770" width="220" height="58" rx="8" class="inner" stroke="#64748b"/>
    <text x="255" y="794" text-anchor="middle" class="box-title">Existing Segment Reduce</text>
    <text x="255" y="816" text-anchor="middle" class="small">unchanged in P0</text>

    <rect x="425" y="714" width="280" height="150" rx="11" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <text x="565" y="747" text-anchor="middle" class="hand component-title">Target QN A2</text>
    <rect x="455" y="770" width="220" height="58" rx="8" class="inner" stroke="#64748b"/>
    <text x="565" y="794" text-anchor="middle" class="box-title">Existing Segment Reduce</text>
    <text x="565" y="816" text-anchor="middle" class="small">unchanged in P0</text>

    <rect x="885" y="714" width="280" height="150" rx="11" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <text x="1025" y="747" text-anchor="middle" class="hand component-title">Target QN B1</text>
    <rect x="915" y="770" width="220" height="58" rx="8" class="inner" stroke="#64748b"/>
    <text x="1025" y="794" text-anchor="middle" class="box-title">Existing Segment Reduce</text>
    <text x="1025" y="816" text-anchor="middle" class="small">unchanged in P0</text>

    <rect x="1195" y="714" width="280" height="150" rx="11" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <text x="1335" y="747" text-anchor="middle" class="hand component-title">Target QN B2</text>
    <rect x="1225" y="770" width="220" height="58" rx="8" class="inner" stroke="#64748b"/>
    <text x="1335" y="794" text-anchor="middle" class="box-title">Existing Segment Reduce</text>
    <text x="1335" y="816" text-anchor="middle" class="small">unchanged in P0</text>
  </g>

  <text x="800" y="900" text-anchor="middle" class="small">Each upper fan-in owns child streams, one StreamReducer, and one parent-facing reduced stream.</text>
</svg>
