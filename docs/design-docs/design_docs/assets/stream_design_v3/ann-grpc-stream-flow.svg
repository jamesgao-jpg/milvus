<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">M1A Iterator ANN Flow</title>
  <desc id="desc">For an iterator ANN request, Proxy resolves vchannels, obtains a QueryPlan from SN for each vchannel, opens SN and QN client streams, reduces each vchannel, and combines the vchannel streams into the final OrderedReduceStream. Non-iterator requests remain on the batch path.</desc>
  <defs>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f0fdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bbf7d0" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="amberHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fffbeb"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fde68a" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="grayHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.6"/>
    </pattern>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .title { font-size: 34px; }
      .component-title { font-size: 21px; }
      .box-title { font-size: 17px; font-weight: 760; }
      .body { font-size: 13px; font-weight: 650; }
      .small { fill: #667085; font-size: 11px; font-weight: 650; }
      .data { font-size: 10px; font-weight: 800; }
      .outline { stroke-width: 2.2; }
      .stream-line { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="80" y="48" class="hand title">M1A Iterator ANN Flow</text>

  <!-- Proxy process -->
  <rect x="55" y="75" width="1490" height="575" rx="14" fill="url(#grayHatch)" stroke="#64748b" stroke-width="2.2" stroke-dasharray="9 7"/>
  <text x="800" y="108" text-anchor="middle" class="hand component-title">Proxy process</text>

  <!-- Caller and final fan-in -->
  <rect x="590" y="125" width="420" height="72" rx="8" fill="#ffffff" stroke="#475569" class="outline"/>
  <text x="800" y="153" text-anchor="middle" class="box-title">queryTask / searchTask</text>
  <text x="800" y="178" text-anchor="middle" class="body">CHUNK = reducedStream.Recv()</text>

  <rect x="500" y="235" width="600" height="95" rx="9" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  <text x="800" y="271" text-anchor="middle" class="hand component-title">Final OrderedReduceStream</text>
  <text x="800" y="301" text-anchor="middle" class="body">children = per-vchannel ReduceStreams</text>
  <path class="stream-line" d="M800 235 V198" marker-end="url(#arrowGreen)"/>
  <rect x="820" y="207" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <text x="845" y="223" text-anchor="middle" class="data">CHUNK</text>

  <text x="800" y="385" text-anchor="middle" class="hand component-title">legacyClient resolves vchannels</text>

  <!-- Per-vchannel QueryView fan-ins -->
  <rect x="115" y="395" width="650" height="220" rx="11" fill="#ffffff" stroke="#059669" class="outline"/>
  <rect x="835" y="395" width="650" height="220" rx="11" fill="#ffffff" stroke="#059669" class="outline"/>
  <text x="440" y="425" text-anchor="middle" class="hand component-title">vchannel A - shardViewQueryClient</text>
  <text x="1160" y="425" text-anchor="middle" class="hand component-title">vchannel B - shardViewQueryClient</text>

  <rect x="160" y="450" width="560" height="48" rx="6" fill="url(#blueHatch)" stroke="#2563eb"/>
  <rect x="880" y="450" width="560" height="48" rx="6" fill="url(#blueHatch)" stroke="#2563eb"/>
  <text x="440" y="470" text-anchor="middle" class="box-title">GetQueryPlan from SN</text>
  <text x="440" y="489" text-anchor="middle" class="small">plan.WorkNodes = optional SN + selected QNs</text>
  <text x="1160" y="470" text-anchor="middle" class="box-title">GetQueryPlan from SN</text>
  <text x="1160" y="489" text-anchor="middle" class="small">plan.WorkNodes = optional SN + selected QNs</text>

  <rect x="185" y="530" width="510" height="62" rx="7" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  <rect x="905" y="530" width="510" height="62" rx="7" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  <text x="440" y="568" text-anchor="middle" class="box-title">Per-vchannel OrderedReduceStream</text>
  <text x="1160" y="568" text-anchor="middle" class="box-title">Per-vchannel OrderedReduceStream</text>

  <path class="stream-line" d="M695 561 H790 V345 H720 V330" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M905 561 H810 V345 H880 V330" marker-end="url(#arrowGreen)"/>
  <rect x="735" y="333" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <rect x="815" y="333" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <text x="760" y="349" text-anchor="middle" class="data">CHUNK</text>
  <text x="840" y="349" text-anchor="middle" class="data">CHUNK</text>

  <!-- Remote work nodes -->
  <text x="800" y="690" text-anchor="middle" class="hand component-title">QueryPlan work nodes</text>

  <rect x="115" y="720" width="290" height="130" rx="10" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
  <rect x="475" y="720" width="290" height="130" rx="10" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
  <rect x="835" y="720" width="290" height="130" rx="10" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
  <rect x="1195" y="720" width="290" height="130" rx="10" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

  <text x="260" y="756" text-anchor="middle" class="hand component-title">SN - vchannel A</text>
  <text x="620" y="756" text-anchor="middle" class="hand component-title">QN(s) - vchannel A</text>
  <text x="980" y="756" text-anchor="middle" class="hand component-title">SN - vchannel B</text>
  <text x="1340" y="756" text-anchor="middle" class="hand component-title">QN(s) - vchannel B</text>
  <text x="260" y="792" text-anchor="middle" class="box-title">SearchOnViewStream()</text>
  <text x="620" y="792" text-anchor="middle" class="box-title">SearchOnViewStream()</text>
  <text x="980" y="792" text-anchor="middle" class="box-title">SearchOnViewStream()</text>
  <text x="1340" y="792" text-anchor="middle" class="box-title">SearchOnViewStream()</text>
  <text x="260" y="822" text-anchor="middle" class="small">generated client stream</text>
  <text x="620" y="822" text-anchor="middle" class="small">generated client stream</text>
  <text x="980" y="822" text-anchor="middle" class="small">generated client stream</text>
  <text x="1340" y="822" text-anchor="middle" class="small">generated client stream</text>

  <path class="stream-line" d="M260 720 V670 H350 V615" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M620 720 V670 H530 V615" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M980 720 V670 H1070 V615" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M1340 720 V670 H1250 V615" marker-end="url(#arrowGreen)"/>

  <rect x="315" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <rect x="515" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <rect x="1035" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <rect x="1235" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  <text x="340" y="668" text-anchor="middle" class="data">CHUNK</text>
  <text x="540" y="668" text-anchor="middle" class="data">CHUNK</text>
  <text x="1060" y="668" text-anchor="middle" class="data">CHUNK</text>
  <text x="1260" y="668" text-anchor="middle" class="data">CHUNK</text>
</svg>
