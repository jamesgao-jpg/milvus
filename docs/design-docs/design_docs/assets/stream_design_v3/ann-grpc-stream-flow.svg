<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Plain ANN Search gRPC streaming flow</title>
  <desc id="desc">Proxy fans in Delegator client streams, each Delegator server method fans in QueryNode client streams, and QueryNodes send chunks from existing local ANN reduction. Requests move downward and chunks move upward.</desc>
  <defs>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f0fdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bbf7d0" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="amberHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fffbeb"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fde68a" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="grayHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="requestHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fff7ed"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fed7aa" stroke-width="3" opacity="0.55"/>
    </pattern>
    <filter id="roughen" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="1" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.7"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 36px; }
      .level-title { font-size: 27px; }
      .lane-title { font-size: 23px; }
      .box-title { font-size: 18px; font-weight: 760; }
      .method-title { font-size: 14px; font-weight: 760; }
      .qn-method { font-size: 12px; font-weight: 760; }
      .code { font-size: 15px; font-weight: 620; }
      .body { font-size: 15px; font-weight: 620; }
      .small { fill: #667085; font-size: 13px; font-weight: 650; }
      .tiny { fill: #667085; font-size: 11px; font-weight: 700; }
      .outline { stroke-width: 2.2; }
      .inner { fill: #ffffff; stroke-width: 1.7; }
      .chunk-flow { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .request-flow { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-dasharray: 9 7; stroke-linecap: round; }
      .soft-line { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1900" height="1450" fill="#ffffff"/>
  <text x="950" y="48" text-anchor="middle" class="hand title">ANN gRPC Stream Flow</text>

  <!-- Proxy -->
  <g filter="url(#roughen)">
    <rect x="210" y="80" width="1060" height="190" rx="12" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
    <rect x="520" y="155" width="440" height="95" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  </g>
  <text x="740" y="116" text-anchor="middle" class="hand level-title">Proxy</text>
  <text x="740" y="190" text-anchor="middle" class="hand lane-title">OrderedReduceStream</text>
  <text x="740" y="225" text-anchor="middle" class="mono code">CHUNK = Recv()</text>

  <!-- Delegator lane A -->
  <g filter="url(#roughen)">
    <rect x="55" y="320" width="665" height="445" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>
    <rect x="160" y="365" width="455" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <rect x="160" y="495" width="455" height="125" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="160" y="665" width="455" height="72" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  </g>
  <text x="80" y="354" class="hand lane-title">Delegator A</text>
  <text x="388" y="400" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="388" y="425" text-anchor="middle" class="method-title">delegatorClient.SearchStream()</text>
  <text x="388" y="520" text-anchor="middle" class="box-title">server</text>
  <text x="388" y="545" text-anchor="middle" class="method-title">SearchStream(request)</text>
  <text x="388" y="570" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="388" y="595" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="388" y="704" text-anchor="middle" class="box-title">Delegator OrderedReduceStream</text>

  <!-- Delegator lane B -->
  <g filter="url(#roughen)">
    <rect x="760" y="320" width="665" height="445" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>
    <rect x="865" y="365" width="455" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <rect x="865" y="495" width="455" height="125" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="865" y="665" width="455" height="72" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  </g>
  <text x="785" y="354" class="hand lane-title">Delegator B</text>
  <text x="1093" y="400" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="1093" y="425" text-anchor="middle" class="method-title">delegatorClient.SearchStream()</text>
  <text x="1093" y="520" text-anchor="middle" class="box-title">server</text>
  <text x="1093" y="545" text-anchor="middle" class="method-title">SearchStream(request)</text>
  <text x="1093" y="570" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="1093" y="595" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="1093" y="704" text-anchor="middle" class="box-title">Delegator OrderedReduceStream</text>

  <!-- Proxy-facing CHUNK flow -->
  <path class="chunk-flow" d="M388 365 L388 292 L640 292 L640 250" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1093 365 L1093 292 L840 292 L840 250" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M388 495 L388 447" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1093 495 L1093 447" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M388 665 L388 620" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1093 665 L1093 620" marker-end="url(#arrowGreen)"/>

  <!-- QN lanes -->
  <g filter="url(#roughen)">
    <rect x="55" y="835" width="315" height="485" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>
    <rect x="405" y="835" width="315" height="485" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>
    <rect x="760" y="835" width="315" height="485" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>
    <rect x="1110" y="835" width="315" height="485" rx="12" fill="#ffffff" stroke="#475569" class="outline"/>

    <rect x="70" y="880" width="285" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <rect x="420" y="880" width="285" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <rect x="775" y="880" width="285" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>
    <rect x="1125" y="880" width="285" height="82" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

    <rect x="70" y="1000" width="285" height="132" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="420" y="1000" width="285" height="132" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="775" y="1000" width="285" height="132" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="1125" y="1000" width="285" height="132" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>

    <rect x="70" y="1170" width="285" height="115" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
    <rect x="420" y="1170" width="285" height="115" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
    <rect x="775" y="1170" width="285" height="115" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
    <rect x="1125" y="1170" width="285" height="115" rx="8" fill="url(#amberHatch)" stroke="#d97706" class="outline"/>
  </g>

  <text x="75" y="867" class="hand lane-title">QN-A1</text>
  <text x="425" y="867" class="hand lane-title">QN-A2</text>
  <text x="780" y="867" class="hand lane-title">QN-B1</text>
  <text x="1130" y="867" class="hand lane-title">QN-B2</text>

  <!-- QN text A1 -->
  <text x="213" y="910" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="213" y="936" text-anchor="middle" class="method-title">qnClient.SearchStreamSegments()</text>
  <text x="213" y="1028" text-anchor="middle" class="box-title">server</text>
  <text x="213" y="1053" text-anchor="middle" class="method-title">SearchStreamSegments(request)</text>
  <text x="213" y="1080" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="213" y="1107" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="213" y="1230" text-anchor="middle" class="box-title">OrderedReduceStream</text>

  <!-- QN text A2 -->
  <text x="563" y="910" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="563" y="936" text-anchor="middle" class="method-title">qnClient.SearchStreamSegments()</text>
  <text x="563" y="1028" text-anchor="middle" class="box-title">server</text>
  <text x="563" y="1053" text-anchor="middle" class="method-title">SearchStreamSegments(request)</text>
  <text x="563" y="1080" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="563" y="1107" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="563" y="1230" text-anchor="middle" class="box-title">OrderedReduceStream</text>

  <!-- QN text B1 -->
  <text x="918" y="910" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="918" y="936" text-anchor="middle" class="method-title">qnClient.SearchStreamSegments()</text>
  <text x="918" y="1028" text-anchor="middle" class="box-title">server</text>
  <text x="918" y="1053" text-anchor="middle" class="method-title">SearchStreamSegments(request)</text>
  <text x="918" y="1080" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="918" y="1107" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="918" y="1230" text-anchor="middle" class="box-title">OrderedReduceStream</text>

  <!-- QN text B2 -->
  <text x="1268" y="910" text-anchor="middle" class="method-title">clientStream =</text>
  <text x="1268" y="936" text-anchor="middle" class="method-title">qnClient.SearchStreamSegments()</text>
  <text x="1268" y="1028" text-anchor="middle" class="box-title">server</text>
  <text x="1268" y="1053" text-anchor="middle" class="method-title">SearchStreamSegments(request)</text>
  <text x="1268" y="1080" text-anchor="middle" class="mono code">CHUNK = reducedStream.Recv()</text>
  <text x="1268" y="1107" text-anchor="middle" class="mono code">serverStream.Send(CHUNK)</text>
  <text x="1268" y="1230" text-anchor="middle" class="box-title">OrderedReduceStream</text>

  <!-- QN CHUNK flow -->
  <path class="chunk-flow" d="M213 1170 L213 1132" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M563 1170 L563 1132" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M918 1170 L918 1132" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1268 1170 L1268 1132" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M213 1000 L213 962" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M563 1000 L563 962" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M918 1000 L918 962" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1268 1000 L1268 962" marker-end="url(#arrowGreen)"/>

  <!-- QN client streams into Delegator ReduceStreams -->
  <path class="chunk-flow" d="M213 880 L213 805 L330 805 L330 737" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M563 880 L563 805 L445 805 L445 737" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M918 880 L918 805 L1035 805 L1035 737" marker-end="url(#arrowGreen)"/>
  <path class="chunk-flow" d="M1268 880 L1268 805 L1150 805 L1150 737" marker-end="url(#arrowGreen)"/>

  <!-- Right request rail -->
  <text x="1690" y="132" text-anchor="middle" class="hand lane-title">ANN request</text>
  <path class="request-flow" d="M1515 145 L1515 1285" marker-end="url(#arrowBlue)"/>

  <text x="1560" y="205" class="hand lane-title">Proxy</text>
  <text x="1560" y="250" class="body">open Delegators</text>
  <text x="1560" y="285" class="body">Recv() to topK</text>
  <text x="1560" y="320" class="body">Close()</text>

  <text x="1560" y="535" class="hand lane-title">Delegator</text>
  <text x="1560" y="585" class="body">open QNs</text>
  <text x="1560" y="625" class="body">Recv(); Send()</text>

  <text x="1560" y="910" class="hand lane-title">QN</text>
  <text x="1560" y="960" class="body">create ReduceStream</text>
  <text x="1560" y="1000" class="body">Recv(); Send()</text>
</svg>
