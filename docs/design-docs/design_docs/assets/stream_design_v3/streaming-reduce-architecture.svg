<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Batch and Streaming Reduce architecture</title>
  <desc id="desc">The same QN, Delegator, Proxy, and Client components are compared. Batch fan-in sends and retains complete child results, while streaming fan-in continuously consumes and produces CHUNKs through ReduceStream.</desc>
  <defs>
    <pattern id="redHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fff5f5"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fecaca" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f0fdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bbf7d0" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="grayHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.6"/>
    </pattern>
    <filter id="roughen" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .title { font-size: 34px; }
      .panel-title { font-size: 25px; }
      .component-title { font-size: 20px; }
      .source-title { font-size: 15px; font-weight: 760; }
      .box-title { font-size: 17px; font-weight: 760; }
      .body { font-size: 14px; font-weight: 650; }
      .small { fill: #667085; font-size: 12px; font-weight: 650; }
      .data { font-size: 11px; font-weight: 800; }
      .chunk { font-size: 9px; font-weight: 800; }
      .outline { stroke-width: 2.2; }
      .inner { fill: #ffffff; stroke-width: 1.7; }
      .batch-line { fill: none; stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
      .stream-line { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; }
      .control-line { fill: none; stroke: #475569; stroke-width: 2.1; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="hand title">Batch vs Streaming Reduce</text>

  <!-- Shared component frames -->
  <g filter="url(#roughen)">
    <rect x="55" y="75" width="1490" height="345" rx="14" fill="url(#redHatch)" stroke="#dc2626" class="outline"/>
    <rect x="55" y="455" width="1490" height="370" rx="14" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

    <!-- Batch sources -->
    <rect x="100" y="150" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="100" y="230" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="100" y="310" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>

    <!-- Batch fan-ins -->
    <rect x="480" y="130" width="280" height="270" rx="11" class="inner" stroke="#dc2626"/>
    <rect x="980" y="130" width="280" height="270" rx="11" class="inner" stroke="#dc2626"/>
    <rect x="1360" y="195" width="140" height="125" rx="10" fill="url(#grayHatch)" stroke="#475569" class="outline"/>

    <!-- Streaming sources -->
    <rect x="100" y="530" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="100" y="610" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="100" y="690" width="125" height="56" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>

    <!-- Streaming fan-ins -->
    <rect x="480" y="510" width="280" height="270" rx="11" class="inner" stroke="#059669"/>
    <rect x="980" y="510" width="280" height="270" rx="11" class="inner" stroke="#059669"/>
    <rect x="1360" y="575" width="140" height="125" rx="10" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
  </g>

  <!-- Batch transport -->
  <path class="batch-line" d="M225 178 H480" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M225 258 H480" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M225 338 H480" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M760 198 H980" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M760 258 H980" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M760 318 H980" marker-end="url(#arrowRed)"/>
  <path class="control-line" d="M1260 258 H1360" marker-end="url(#arrowGray)"/>

  <!-- Streaming transport -->
  <path class="stream-line" d="M225 558 H480" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M225 638 H480" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M225 718 H480" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M760 578 H980" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M760 638 H980" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M760 698 H980" marker-end="url(#arrowGreen)"/>
  <path class="control-line" d="M1260 638 H1360" marker-end="url(#arrowGray)"/>

  <!-- Batch data and fan-in internals -->
  <g filter="url(#roughen)">
    <rect x="285" y="156" width="145" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>
    <rect x="285" y="236" width="145" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>
    <rect x="285" y="316" width="145" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>

    <rect x="520" y="185" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="520" y="225" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="520" y="265" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="520" y="320" width="200" height="50" rx="7" class="inner" stroke="#475569"/>

    <rect x="805" y="176" width="130" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>
    <rect x="805" y="236" width="130" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>
    <rect x="805" y="296" width="130" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" class="outline"/>

    <rect x="1020" y="185" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="1020" y="225" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="1020" y="265" width="200" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="1020" y="320" width="200" height="50" rx="7" class="inner" stroke="#475569"/>

    <rect x="1280" y="238" width="65" height="40" rx="6" fill="#f8fafc" stroke="#475569"/>
  </g>

  <path class="control-line" d="M620 293 V320" marker-end="url(#arrowGray)"/>
  <path class="control-line" d="M1120 293 V320" marker-end="url(#arrowGray)"/>

  <!-- Streaming CHUNKs -->
  <g filter="url(#roughen)">
    <!-- QN streams -->
    <rect x="275" y="546" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="340" y="546" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="405" y="546" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="275" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="340" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="405" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="275" y="706" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="340" y="706" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="405" y="706" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>

    <!-- Delegator ReduceStream -->
    <rect x="515" y="575" width="210" height="155" rx="8" class="inner" stroke="#059669"/>
    <rect x="535" y="620" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="535" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="535" y="684" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="655" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>

    <!-- Delegator streams -->
    <rect x="795" y="566" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="855" y="566" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="915" y="566" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="795" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="855" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="915" y="626" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="795" y="686" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="855" y="686" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="915" y="686" width="44" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>

    <!-- Proxy ReduceStream -->
    <rect x="1015" y="575" width="210" height="155" rx="8" class="inner" stroke="#059669"/>
    <rect x="1035" y="620" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="1035" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="1035" y="684" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="1155" y="652" width="50" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  </g>

  <path class="stream-line" d="M590 664 H650" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M1090 664 H1150" marker-end="url(#arrowGreen)"/>

  <!-- Labels -->
  <text x="90" y="115" class="hand panel-title">Current: Batch fan-in</text>
  <text x="90" y="495" class="hand panel-title">Proposed: Streaming fan-in</text>

  <text x="162" y="184" text-anchor="middle" class="source-title">QN 1</text>
  <text x="162" y="264" text-anchor="middle" class="source-title">QN 2</text>
  <text x="162" y="344" text-anchor="middle" class="source-title">QN N</text>
  <text x="162" y="564" text-anchor="middle" class="source-title">QN 1</text>
  <text x="162" y="644" text-anchor="middle" class="source-title">QN 2</text>
  <text x="162" y="724" text-anchor="middle" class="source-title">QN N</text>

  <text x="620" y="163" text-anchor="middle" class="hand component-title">Delegator fan-ins</text>
  <text x="1120" y="163" text-anchor="middle" class="hand component-title">Proxy fan-in</text>
  <text x="620" y="543" text-anchor="middle" class="hand component-title">Delegator fan-ins</text>
  <text x="1120" y="543" text-anchor="middle" class="hand component-title">Proxy fan-in</text>

  <text x="1430" y="235" text-anchor="middle" class="hand component-title">Client</text>
  <text x="1430" y="270" text-anchor="middle" class="body">unary response</text>
  <text x="1430" y="615" text-anchor="middle" class="hand component-title">Client</text>
  <text x="1430" y="650" text-anchor="middle" class="body">unary response</text>

  <!-- FULL RESULT labels -->
  <text x="357" y="183" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="357" y="263" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="357" y="343" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="620" y="204" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="620" y="244" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="620" y="284" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="620" y="351" text-anchor="middle" class="box-title">Batch Reduce</text>
  <text x="870" y="203" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="870" y="263" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="870" y="323" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="1120" y="204" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="1120" y="244" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="1120" y="284" text-anchor="middle" class="data">FULL RESULT</text>
  <text x="1120" y="351" text-anchor="middle" class="box-title">Batch Reduce</text>
  <text x="1312" y="263" text-anchor="middle" class="data">RESULT</text>

  <!-- CHUNK labels -->
  <text x="297" y="562" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="362" y="562" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="427" y="562" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="297" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="362" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="427" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="297" y="722" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="362" y="722" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="427" y="722" text-anchor="middle" class="chunk">CHUNK</text>

  <text x="620" y="605" text-anchor="middle" class="box-title">ReduceStream</text>
  <text x="560" y="636" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="560" y="668" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="560" y="700" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="680" y="668" text-anchor="middle" class="chunk">CHUNK</text>

  <text x="817" y="582" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="877" y="582" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="937" y="582" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="817" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="877" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="937" y="642" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="817" y="702" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="877" y="702" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="937" y="702" text-anchor="middle" class="chunk">CHUNK</text>

  <text x="1120" y="605" text-anchor="middle" class="box-title">ReduceStream</text>
  <text x="1060" y="636" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="1060" y="668" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="1060" y="700" text-anchor="middle" class="chunk">CHUNK</text>
  <text x="1180" y="668" text-anchor="middle" class="chunk">CHUNK</text>
</svg>
