<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Batch and Streaming Reduce architecture</title>
  <desc id="desc">Current full-result collection and proposed streaming fan-in use the same QueryView work nodes, per-vchannel fan-ins in Proxy, final Proxy fan-in, and unary client response.</desc>
  <defs>
    <pattern id="redHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#fff5f5"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fecaca" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f0fdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bbf7d0" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.65"/>
    </pattern>
    <pattern id="grayHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.6"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .title { font-size: 34px; }
      .panel-title { font-size: 25px; }
      .component-title { font-size: 20px; }
      .source-title { font-size: 15px; font-weight: 760; }
      .box-title { font-size: 17px; font-weight: 760; }
      .body { font-size: 13px; font-weight: 650; }
      .small { fill: #667085; font-size: 11px; font-weight: 650; }
      .data { font-size: 10px; font-weight: 800; }
      .outline { stroke-width: 2.2; }
      .batch-line { fill: none; stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
      .stream-line { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; }
      .control-line { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="hand title">Batch vs Streaming Reduce</text>

  <rect x="40" y="75" width="1520" height="345" rx="14" fill="url(#redHatch)" stroke="#dc2626" class="outline"/>
  <rect x="40" y="455" width="1520" height="370" rx="14" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

  <text x="75" y="115" class="hand panel-title">Current: Batch fan-in</text>
  <text x="75" y="495" class="hand panel-title">Proposed: Streaming fan-in</text>

  <!-- Work-node groups -->
  <g>
    <rect x="80" y="150" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="80" y="230" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="80" y="310" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="80" y="530" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="80" y="610" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
    <rect x="80" y="690" width="230" height="58" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
  </g>

  <text x="195" y="174" text-anchor="middle" class="source-title">vchannel A work nodes</text>
  <text x="195" y="194" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>
  <text x="195" y="254" text-anchor="middle" class="source-title">vchannel B work nodes</text>
  <text x="195" y="274" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>
  <text x="195" y="334" text-anchor="middle" class="source-title">vchannel N work nodes</text>
  <text x="195" y="354" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>
  <text x="195" y="554" text-anchor="middle" class="source-title">vchannel A work nodes</text>
  <text x="195" y="574" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>
  <text x="195" y="634" text-anchor="middle" class="source-title">vchannel B work nodes</text>
  <text x="195" y="654" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>
  <text x="195" y="714" text-anchor="middle" class="source-title">vchannel N work nodes</text>
  <text x="195" y="734" text-anchor="middle" class="small">SN + QNs from QueryPlan</text>

  <!-- Proxy process boundaries -->
  <rect x="410" y="125" width="890" height="270" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="410" y="505" width="890" height="285" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="855" y="151" text-anchor="middle" class="hand component-title">Proxy process</text>
  <text x="855" y="531" text-anchor="middle" class="hand component-title">Proxy process</text>

  <!-- Per-vchannel fan-ins -->
  <rect x="445" y="165" width="450" height="205" rx="10" fill="#ffffff" stroke="#dc2626" class="outline"/>
  <rect x="445" y="545" width="450" height="220" rx="10" fill="#ffffff" stroke="#059669" class="outline"/>
  <text x="670" y="194" text-anchor="middle" class="hand component-title">Per-vchannel fan-ins</text>
  <text x="670" y="574" text-anchor="middle" class="hand component-title">Per-vchannel fan-ins</text>

  <g>
    <rect x="480" y="210" width="380" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="480" y="270" width="380" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="480" y="330" width="380" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="480" y="590" width="380" height="42" rx="6" fill="#dcfce7" stroke="#059669"/>
    <rect x="480" y="650" width="380" height="42" rx="6" fill="#dcfce7" stroke="#059669"/>
    <rect x="480" y="710" width="380" height="42" rx="6" fill="#dcfce7" stroke="#059669"/>
  </g>
  <text x="670" y="235" text-anchor="middle" class="box-title">Collect complete work-node results</text>
  <text x="670" y="295" text-anchor="middle" class="box-title">Collect complete work-node results</text>
  <text x="670" y="355" text-anchor="middle" class="box-title">Collect complete work-node results</text>
  <text x="670" y="617" text-anchor="middle" class="box-title">ReduceStream</text>
  <text x="670" y="677" text-anchor="middle" class="box-title">ReduceStream</text>
  <text x="670" y="737" text-anchor="middle" class="box-title">ReduceStream</text>

  <!-- Final fan-ins -->
  <rect x="960" y="190" width="300" height="155" rx="10" fill="#ffffff" stroke="#dc2626" class="outline"/>
  <rect x="960" y="590" width="300" height="155" rx="10" fill="#ffffff" stroke="#059669" class="outline"/>
  <text x="1110" y="220" text-anchor="middle" class="hand component-title">Final fan-in</text>
  <text x="1110" y="620" text-anchor="middle" class="hand component-title">Final fan-in</text>
  <rect x="995" y="245" width="230" height="65" rx="7" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
  <rect x="995" y="645" width="230" height="65" rx="7" fill="#dcfce7" stroke="#059669" class="outline"/>
  <text x="1110" y="284" text-anchor="middle" class="box-title">Batch Reduce</text>
  <text x="1110" y="684" text-anchor="middle" class="box-title">ReduceStream</text>

  <!-- Client -->
  <rect x="1380" y="210" width="140" height="115" rx="10" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
  <rect x="1380" y="610" width="140" height="115" rx="10" fill="url(#grayHatch)" stroke="#475569" class="outline"/>
  <text x="1450" y="250" text-anchor="middle" class="hand component-title">Client</text>
  <text x="1450" y="282" text-anchor="middle" class="body">unary response</text>
  <text x="1450" y="650" text-anchor="middle" class="hand component-title">Client</text>
  <text x="1450" y="682" text-anchor="middle" class="body">unary response</text>

  <!-- Batch data flow -->
  <path class="batch-line" d="M310 179 H480" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M310 259 H480" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M310 339 H480" marker-end="url(#arrowRed)"/>
  <rect x="335" y="163" width="110" height="30" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="335" y="243" width="110" height="30" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="335" y="323" width="110" height="30" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="390" y="182" text-anchor="middle" class="data">FULL RESULTS</text>
  <text x="390" y="262" text-anchor="middle" class="data">FULL RESULTS</text>
  <text x="390" y="342" text-anchor="middle" class="data">FULL RESULTS</text>
  <path class="batch-line" d="M860 230 H920 V260 H960" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M860 290 H960" marker-end="url(#arrowRed)"/>
  <path class="batch-line" d="M860 350 H920 V320 H960" marker-end="url(#arrowRed)"/>
  <path class="control-line" d="M1260 277 H1380" marker-end="url(#arrowGray)"/>

  <!-- Streaming data flow -->
  <path class="stream-line" d="M310 559 H480" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M310 639 H480" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M310 719 H480" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="332" y="547" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="390" y="547" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="332" y="627" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="390" y="627" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="332" y="707" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <rect x="390" y="707" width="42" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
  </g>
  <text x="353" y="563" text-anchor="middle" class="data">CHUNK</text>
  <text x="411" y="563" text-anchor="middle" class="data">CHUNK</text>
  <text x="353" y="643" text-anchor="middle" class="data">CHUNK</text>
  <text x="411" y="643" text-anchor="middle" class="data">CHUNK</text>
  <text x="353" y="723" text-anchor="middle" class="data">CHUNK</text>
  <text x="411" y="723" text-anchor="middle" class="data">CHUNK</text>
  <path class="stream-line" d="M860 611 H920 V650 H960" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M860 671 H960" marker-end="url(#arrowGreen)"/>
  <path class="stream-line" d="M860 731 H920 V690 H960" marker-end="url(#arrowGreen)"/>
  <rect x="885" y="653" width="48" height="26" rx="4" fill="#dcfce7" stroke="#059669"/>
  <text x="909" y="670" text-anchor="middle" class="data">CHUNK</text>
  <path class="control-line" d="M1260 677 H1380" marker-end="url(#arrowGray)"/>
</svg>
