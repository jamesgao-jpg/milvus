<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">ReduceStream Recv shared workflow and two implementations</title>
  <desc id="desc">The generic Recv workflow expands into OrderedReduceStream and UnOrderedReduceStream behavior.</desc>
  <defs>
    <pattern id="genericHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d8dee8" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="blueHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#eff6ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bfdbfe" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="12" height="12" fill="#f0fdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bbf7d0" stroke-width="3" opacity="0.55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .hand { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-weight: 700; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 34px; }
      .panel-title { font-size: 27px; }
      .stage { font-size: 17px; font-weight: 760; }
      .code { font-size: 16px; font-weight: 620; }
      .small { fill: #667085; font-size: 13px; font-weight: 650; }
      .outline { stroke-width: 2.2; }
      .inner { fill: #ffffff; stroke-width: 1.6; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .mapping { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="hand title">ReduceStream.Recv(): Shared Workflow and Two Implementations</text>

  <rect x="185" y="82" width="1430" height="300" rx="12" fill="url(#genericHatch)" stroke="#475569" class="outline"/>
  <rect x="25" y="190" width="135" height="78" rx="8" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
  <rect x="1640" y="190" width="135" height="78" rx="8" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

  <text x="900" y="121" text-anchor="middle" class="hand panel-title">Generic Recv()</text>
  <text x="92" y="220" text-anchor="middle" class="hand stage">childStreams[]</text>
  <text x="92" y="244" text-anchor="middle" class="small">stream inputs</text>
  <text x="1708" y="220" text-anchor="middle" class="hand stage">Chunk</text>
  <text x="1708" y="244" text-anchor="middle" class="small">protobuf output</text>

  <rect x="225" y="190" width="175" height="78" rx="8" class="inner" stroke="#475569"/>
  <rect x="440" y="190" width="190" height="78" rx="8" class="inner" stroke="#475569"/>
  <rect x="670" y="190" width="175" height="78" rx="8" class="inner" stroke="#475569"/>
  <rect x="885" y="190" width="175" height="78" rx="8" class="inner" stroke="#475569"/>
  <path d="M1130 229 L1190 177 L1250 229 L1190 281 z" fill="#ffffff" stroke="#475569" class="outline"/>
  <rect x="1320" y="190" width="250" height="78" rx="8" class="inner" stroke="#475569"/>

  <text x="312" y="220" text-anchor="middle" class="stage">1  AllocBuffer</text>
  <text x="312" y="244" text-anchor="middle" class="small">outputBuffer</text>
  <text x="535" y="220" text-anchor="middle" class="stage">2  GetReadyBuffers</text>
  <text x="535" y="244" text-anchor="middle" class="small">child Buffers</text>
  <text x="758" y="220" text-anchor="middle" class="stage">3  ProduceNextUnits</text>
  <text x="758" y="244" text-anchor="middle" class="small">nextUnits</text>
  <text x="972" y="220" text-anchor="middle" class="stage">4  Merge</text>
  <text x="972" y="244" text-anchor="middle" class="small">nextUnits</text>
  <text x="1190" y="223" text-anchor="middle" class="stage">5</text>
  <text x="1190" y="247" text-anchor="middle" class="small">IsChunkReady?</text>
  <text x="1445" y="220" text-anchor="middle" class="stage">6  CreateOutputChunk</text>
  <text x="1445" y="244" text-anchor="middle" class="small">protobuf message</text>

  <path class="flow" d="M160 229 L225 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M400 229 L440 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M630 229 L670 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M845 229 L885 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M1060 229 L1130 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M1250 229 L1320 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M1570 229 L1640 229" marker-end="url(#arrow)"/>
  <path class="flow" d="M1190 177 L1190 148 L535 148 L535 190" marker-end="url(#arrow)"/>
  <text x="1274" y="216" class="small">yes</text>
  <text x="1165" y="141" class="small">no: continue</text>

  <path class="mapping" d="M900 382 L900 410 L455 410 L455 438" marker-end="url(#arrow)"/>
  <path class="mapping" d="M900 382 L900 410 L1345 410 L1345 438" marker-end="url(#arrow)"/>
  <text x="900" y="404" text-anchor="middle" class="small">strategy-specific behavior</text>

  <rect x="45" y="438" width="820" height="600" rx="12" fill="url(#blueHatch)" stroke="#2563eb" class="outline"/>
  <rect x="935" y="438" width="820" height="600" rx="12" fill="url(#greenHatch)" stroke="#059669" class="outline"/>

  <text x="455" y="482" text-anchor="middle" class="hand panel-title">OrderedReduceStream</text>
  <text x="1345" y="482" text-anchor="middle" class="hand panel-title">UnOrderedReduceStream</text>

  <rect x="75" y="510" width="760" height="90" rx="7" class="inner" stroke="#93c5fd"/>
  <rect x="75" y="615" width="760" height="185" rx="7" class="inner" stroke="#93c5fd"/>
  <rect x="75" y="815" width="760" height="140" rx="7" class="inner" stroke="#93c5fd"/>
  <rect x="75" y="970" width="760" height="55" rx="7" class="inner" stroke="#93c5fd"/>

  <text x="105" y="542" class="stage">1  AllocBuffer</text>
  <text x="105" y="574" class="mono code">outputBuffer = queue&lt;Unit&gt;</text>
  <text x="105" y="647" class="stage">2  GetReadyBuffers</text>
  <text x="105" y="679" class="mono code">clear completed childRecvTasks</text>
  <text x="105" y="708" class="mono code">start one task for each empty child Buffer</text>
  <text x="105" y="737" class="mono code">await every active child Buffer</text>
  <text x="105" y="766" class="mono code">if Buffer.Size() &lt;= y: start one task</text>
  <text x="105" y="847" class="stage">3  ProduceNextUnits</text>
  <text x="105" y="875" class="mono code">nextUnits = queue&lt;Unit&gt;</text>
  <text x="105" y="899" class="mono code">while every active Buffer has data and nextUnits.Size() &lt; X:</text>
  <text x="105" y="923" class="mono code">    winner = first Front() by request ordering</text>
  <text x="105" y="947" class="mono code">    nextUnits.Append(readyBuffers[winner].Pop())</text>
  <text x="105" y="1003" class="stage">5  IsChunkReady</text>
  <text x="360" y="1003" class="mono code">Size() &gt;= X or all children drained</text>

  <rect x="965" y="510" width="760" height="90" rx="7" class="inner" stroke="#86efac"/>
  <rect x="965" y="615" width="760" height="185" rx="7" class="inner" stroke="#86efac"/>
  <rect x="965" y="815" width="760" height="140" rx="7" class="inner" stroke="#86efac"/>
  <rect x="965" y="970" width="760" height="55" rx="7" class="inner" stroke="#86efac"/>

  <text x="995" y="542" class="stage">1  AllocBuffer</text>
  <text x="995" y="574" class="mono code">outputBuffer = queue&lt;Unit&gt;</text>
  <text x="995" y="647" class="stage">2  GetReadyBuffers</text>
  <text x="995" y="679" class="mono code">clear completed childRecvTasks</text>
  <text x="995" y="708" class="mono code">start one task for each empty child Buffer</text>
  <text x="995" y="737" class="mono code">await any active child Buffer</text>
  <text x="995" y="766" class="mono code">return childBuffers</text>
  <text x="995" y="847" class="stage">3  ProduceNextUnits</text>
  <text x="995" y="875" class="mono code">nextUnits = queue&lt;Unit&gt;</text>
  <text x="995" y="899" class="mono code">for Buffer in readyBuffers:</text>
  <text x="995" y="923" class="mono code">    while Buffer.Size() &gt; 0 and nextUnits.Size() &lt; X:</text>
  <text x="995" y="947" class="mono code">        nextUnits.Append(Buffer.Pop())</text>
  <text x="995" y="1003" class="stage">5  IsChunkReady</text>
  <text x="1250" y="1003" class="mono code">Size() &gt;= X or all children drained</text>
</svg>
